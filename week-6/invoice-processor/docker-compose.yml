services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: invoice-processor-api
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - api_data:/app/apps/api/data
      - api_uploads:/app/apps/api/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/').then((res) => { if (!res.ok) process.exit(1); }).catch(() => process.exit(1));"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  webapp:
    build:
      context: .
      dockerfile: docker/webapp.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: invoice-processor-webapp
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  api_data:
  api_uploads:
